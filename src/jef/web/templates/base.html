<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Jef{% endblock %}</title>
  <style>
    :root {
      --bg: #fafaf9; --panel: #ffffff; --text: #1c1917; --muted: #78716c;
      --border: #e7e5e4; --accent: #2563eb; --accent-text: #ffffff;
      --waiting: #a8a29e; --progress: #2563eb; --done: #16a34a;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1c1917; --panel: #292524; --text: #f5f5f4; --muted: #a8a29e;
        --border: #44403c; --accent: #60a5fa; --accent-text: #1c1917;
        --waiting: #78716c; --progress: #60a5fa; --done: #4ade80;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; font: 15px/1.5 system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); }
    main { max-width: 880px; margin: 0 auto; padding: 32px 16px 64px; }
    header { display: flex; align-items: baseline; gap: 12px; margin-bottom: 32px; }
    header h1 { margin: 0; font-size: 28px; }
    header p { margin: 0; color: var(--muted); }
    section { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 20px; margin-bottom: 24px; }
    h2 { margin: 0 0 4px; font-size: 18px; }
    .hint { margin: 0 0 16px; color: var(--muted); font-size: 14px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 8px 6px; border-top: 1px solid var(--border); vertical-align: top; }
    th { font-size: 13px; color: var(--muted); font-weight: 600; border-top: none; }
    td.num { color: var(--muted); width: 2.5em; }
    .pill { display: inline-block; padding: 1px 10px; border-radius: 999px; font-size: 13px; border: 1px solid currentColor; }
    .pill.waiting { color: var(--waiting); }
    .pill.in-progress { color: var(--progress); }
    .pill.done { color: var(--done); }
    form { display: flex; gap: 8px; margin-top: 16px; }
    input[type=text] { flex: 1; min-width: 0; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--text); font: inherit; }
    button { padding: 8px 16px; border: none; border-radius: 8px; background: var(--accent); color: var(--accent-text); font: inherit; font-weight: 600; cursor: pointer; }
    .error { color: #dc2626; font-size: 14px; margin: 8px 0 0; }
    .empty { color: var(--muted); margin: 0; }
    .bar { display: flex; height: 8px; border-radius: 4px; overflow: hidden; background: var(--border); margin-top: 6px; min-width: 120px; }
    .bar span { display: block; height: 100%; }
    .s0 { background: var(--waiting); } .s1 { background: #a855f7; } .s2 { background: var(--progress); }
    .s3 { background: #f59e0b; } .s4 { background: var(--done); }
    .legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 13px; color: var(--muted); margin-top: 12px; }
    .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
    footer { color: var(--muted); font-size: 13px; }
    code { font-size: 13px; }
      nav { display: flex; gap: 16px; margin-left: auto; font-size: 14px; }
    nav a { color: var(--muted); text-decoration: none; }
    nav a.active, nav a:hover { color: var(--text); }
    .banner { border: 1px solid #f59e0b; background: color-mix(in srgb, #f59e0b 12%, transparent); border-radius: 10px; padding: 12px 16px; margin-bottom: 24px; }
    .banner a { color: inherit; font-weight: 600; }
    .ok { color: var(--done); font-weight: 600; }
    .missing { color: #d97706; font-weight: 600; }
    input[type=password] { flex: 1; min-width: 0; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--text); font: inherit; }
    button.secondary { background: transparent; color: var(--muted); border: 1px solid var(--border); }
    pre.help { white-space: pre-wrap; font-size: 13px; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; }
    form.stack { flex-direction: column; align-items: stretch; }
    form.stack label { font-weight: 600; }
    form.stack label.check { font-weight: 400; display: flex; gap: 8px; align-items: center; }
    a.cancel { color: var(--muted); margin-left: 12px; }
    a.start { font-weight: 600; color: var(--accent); }
    .pill.idle { color: var(--done); } .pill.working { color: var(--progress); } .pill.stopped { color: var(--waiting); }
    ol.chat { list-style: none; padding: 8px; margin: 0; display: flex; flex-direction: column; gap: 8px; max-height: 60vh; overflow-y: auto; overscroll-behavior: contain; border: 1px solid var(--border); border-radius: 8px; }
    ol.chat li { padding: 8px 12px; border-radius: 8px; white-space: pre-wrap; overflow-wrap: anywhere; }
    ol.chat li.sent { background: color-mix(in srgb, var(--accent) 12%, transparent); align-self: flex-end; max-width: 85%; }
    ol.chat li.text { background: var(--bg); border: 1px solid var(--border); }
    ol.chat li.tool { color: var(--muted); font: 12px ui-monospace, monospace; padding: 2px 12px; }
    ol.chat li.result { color: var(--muted); font-size: 12px; padding: 0 12px; }
    ol.chat li.error { color: #dc2626; }
    ol.phases { list-style: none; display: flex; flex-wrap: wrap; gap: 6px; padding: 0; margin: 12px 0; font-size: 13px; }
    ol.phases li { padding: 2px 10px; border-radius: 999px; border: 1px solid var(--border); color: var(--muted); }
    ol.phases li.current { border-color: var(--accent); color: var(--text); font-weight: 600; }
    .next { margin: 8px 0 0; }
    .banner form { margin-top: 8px; }
    pre.doc { white-space: pre-wrap; font-size: 13px; overflow-wrap: anywhere; }
    details summary { cursor: pointer; } details summary h2 { display: inline; }
    input.minutes { width: 5em; padding: 6px 8px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--text); font: inherit; }
    .notice { color: var(--done); font-size: 14px; margin: 8px 0 0; }
  </style>
{% block head %}{% endblock %}
</head>
<body>
<main>
  <header>
    <h1>Jef</h1>
    <p>Tell Jef what you want built.</p>
    <nav>
      <a href="/" class="{{ 'active' if page == 'home' }}">Home</a>
      <a href="/settings" class="{{ 'active' if page == 'settings' }}">Settings</a>
    </nav>
  </header>
{% block content %}{% endblock %}
</main>
<script>
  // Chats open at the newest message. If you had scrolled up to read, a
  // refresh puts you back where you were; sending a message jumps to the end.
  (() => {
    const chats = [...document.querySelectorAll("ol.chat")];
    const key = (i) => "jef-chat:" + location.pathname + ":" + i;
    let sending = false;
    chats.forEach((c, i) => {
      let saved = null;
      try { saved = JSON.parse(sessionStorage.getItem(key(i))); } catch (e) {}
      c.scrollTop = saved && !saved.atBottom ? saved.top : c.scrollHeight;
    });
    document.addEventListener("submit", () => { sending = true; });
    addEventListener("beforeunload", () => {
      chats.forEach((c, i) => {
        if (sending) { sessionStorage.removeItem(key(i)); return; }
        const atBottom = c.scrollHeight - c.scrollTop - c.clientHeight < 20;
        sessionStorage.setItem(key(i), JSON.stringify({ top: c.scrollTop, atBottom }));
      });
    });
  })();
</script>
</body>
</html>
